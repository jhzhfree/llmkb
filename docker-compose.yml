services:
  mysql:
    image: mysql:8.0
    environment:
      MYSQL_ROOT_PASSWORD: root
      MYSQL_DATABASE: knowledge_os
      MYSQL_USER: knowledge
      MYSQL_PASSWORD: knowledge123
    ports: ["3306:3306"]
    volumes:
      - mysql_data:/var/lib/mysql
      - ./backend/src/main/resources/db/schema.sql:/docker-entrypoint-initdb.d/01-schema.sql:ro
  redis:
    image: redis:7-alpine
    ports: ["6379:6379"]
  neo4j:
    image: neo4j:5
    environment:
      NEO4J_AUTH: neo4j/knowledge123
    ports: ["7474:7474","7687:7687"]
volumes:
  mysql_data:
